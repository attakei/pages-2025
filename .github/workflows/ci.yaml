name: 'Run CI jobs'

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  TASK_X_REMOTE_TASKFILES: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.65.2
      - name: 'Setup env'
        run: |
          task --yes setup
      - name: Lint by pre-commit
        run: |
          lefthook run pre-commit --all-files
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.65.2
      - name: 'Setup workspace'
        run: |
          task --yes setup
      - name: 'Run build as html'
        run: |
          task build-dirhtml
